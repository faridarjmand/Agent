services:
  hermes:
    container_name: hermes
    build:
      context: ./hermes
      dockerfile: Dockerfile
    image: registry.farid.wtf/agent/hermes:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3009:3000"
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    env_file: .env
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Graceful shutdown
    stop_grace_period: 30s